<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Banco Motore</title>

<style>
/* Layout: titolo e modalità in alto, messaggio guida, sezione del motore al centro (zoom e trascinamento), vassoio dei pezzi o comandi della prova in basso. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2127; --muted:#5d6975; --line:#d3d9df;
  --stage:#dde3e9; --accent:#0a62c9; --accent-ink:#ffffff; --ok:#1c7f46; --bad:#c62f2a; --warn:#b26a00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#1a2026; --ink:#e8edf1; --muted:#98a4af; --line:#2c353d;
  --stage:#141a20; --accent:#4c9bff; --accent-ink:#06121f; --ok:#4cc27d; --bad:#ff6b63; --warn:#f0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#1a2026; --ink:#e8edf1; --muted:#98a4af; --line:#2c353d;
  --stage:#141a20; --accent:#4c9bff; --accent-ink:#06121f; --ok:#4cc27d; --bad:#ff6b63; --warn:#f0b04a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:18px;letter-spacing:-.01em}
.seg{display:flex;gap:6px}
.seg .btn{flex:1}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--panel);font-size:13.5px;line-height:1.4;min-height:2.8em;max-height:9.5em;overflow:auto}
.msg b{font-weight:700}
.msg.ok{border-left-color:var(--ok)} .msg.bad{border-left-color:var(--bad)} .msg.warn{border-left-color:var(--warn)}
.msg small{display:block;color:var(--muted);margin-top:4px}
.stage{position:relative;flex:1;min-height:150px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--stage)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:40px;min-height:40px;padding:0;font-size:20px}
.bottom{display:flex;flex-direction:column;gap:8px}
.tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.tile{flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;scroll-snap-align:start}
.tile svg{width:64px;height:56px}
.tile span{font-size:11.5px;line-height:1.15;text-align:center}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tile:disabled{opacity:.4}
.act{display:flex;gap:8px;flex-wrap:wrap}
.act .grow{flex:1}
.run{display:flex;flex-direction:column;gap:8px}
.run label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.run input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.run .val{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.tl{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;font-size:11px;text-align:center}
.tl div{padding:5px 2px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.tl div.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.tl div.cur2{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink);font-weight:700}
.fire{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.fire .dot{min-width:24px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.fire .dot.on{background:#ff8a3d;border-color:#ff8a3d;color:#1b1209;font-weight:700}
.engbtn{width:100%;justify-content:space-between}
.engbtn span{overflow:hidden;text-overflow:ellipsis}
.pick{position:fixed;inset:0;z-index:30;background:rgba(8,12,16,.7);display:flex;align-items:flex-end;justify-content:center}
.pcard{width:100%;max-width:640px;max-height:86%;overflow:auto;box-sizing:border-box;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.pcard h2{margin:0 0 4px;font-size:17px}
.erow{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.erow.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.erow svg{flex:none;width:56px;height:46px}
.erow b{display:block;font-size:14px}
.erow small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.fire .dot.s0{background:#6fb7ff;border-color:#6fb7ff;color:#08202f}
.fire .dot.s1{background:#ffd76a;border-color:#ffd76a;color:#2b2000}
.fire .dot.s2{background:#ff8a3d;border-color:#ff8a3d;color:#1b1209;font-weight:700}
.fire .dot.s3{background:#9aa0a6;border-color:#9aa0a6;color:#101214}
.fire .dot.shown{box-shadow:0 0 0 2px var(--accent)}
.engbtn span:first-child{text-align:left}
.stage{--wall:#c9d0d6;--hole:#aab3bb;--benchA:#9a7b57;--benchB:#7d6244;--benchEdge:#5b452e;--tool:#6d7781}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage{--wall:#232b32;--hole:#141a1f;--benchA:#5c4a37;--benchB:#46372a;--benchEdge:#2e2419;--tool:#46525d}}
:root[data-theme="dark"] .stage{--wall:#232b32;--hole:#141a1f;--benchA:#5c4a37;--benchB:#46372a;--benchEdge:#2e2419;--tool:#46525d}
.stage{background:radial-gradient(circle,var(--hole) 1.6px,transparent 2px) 0 0/22px 22px,var(--wall)}
.bench{position:absolute;left:0;right:0;bottom:0;height:24%;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.2) 118px 120px,rgba(255,255,255,.08) 120px 121px),repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px),linear-gradient(var(--benchA),var(--benchB));border-top:8px solid #6c7782;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 -12px 20px rgba(0,0,0,.22)}
.bench::after{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(rgba(255,255,255,.14),transparent)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 45% at 50% -8%,rgba(255,244,200,.55),transparent 70%)}
:root[data-theme="dark"] .stage::before{background:radial-gradient(ellipse 60% 45% at 50% -8%,rgba(255,220,140,.16),transparent 70%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage::before{background:radial-gradient(ellipse 60% 45% at 50% -8%,rgba(255,220,140,.16),transparent 70%)}}
.dec{position:absolute;bottom:calc(24% - 4px);pointer-events:none}
.tach{position:absolute;right:8px;top:8px;width:104px;height:104px;z-index:2;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}

.tools{position:absolute;left:10px;top:8px;width:190px;height:auto;pointer-events:none;opacity:.9}
#cv{position:relative;z-index:1}.zoom{z-index:2}#eng{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
</style>
</head>

ll="#e8edf1" font-family="Inter,sans-serif">6</text><line x1="105.4" y1="47.8" x2="110.2" y2="46.5" stroke="#ff5b4d" stroke-width="1.2"/><line x1="104.0" y1="60.0" x2="112.0" y2="60.0" stroke="#ff5b4d" stroke-width="2.2"/><text x="95.0" y="63.0" text-anchor="middle" font-size="9" fill="#ff5b4d" font-family="Inter,sans-serif">7</text><line x1="105.4" y1="72.2" x2="110.2" y2="73.5" stroke="#ff5b4d" stroke-width="1.2"/><line x1="98.1" y1="82.0" x2="105.0" y2="86.0" stroke="#ff5b4d" stroke-width="2.2"/><text x="90.3" y="80.5" text-anchor="middle" font-size="9" fill="#ff5b4d" font-family="Inter,sans-serif">8</text><text x="60" y="84" text-anchor="middle" font-size="7" fill="#98a4af" font-family="Inter,sans-serif">x1000 giri/min</text><text id="trpm" x="60" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Inter,sans-serif">0</text><g id="tn" transform="rotate(-120 60 60)"><path d="M58.5 66L60 12L61.5 66Z" fill="#ff5b4d"/></g><circle cx="60" cy="60" r="5" fill="#cdd5dc"/></svg>

/* ---------- messaggi e interfaccia ---------- */
function setMsg(h,k){var m=$('msg');m.className='msg'+(k?' '+k:'');m.innerHTML=h;}
var flash='';

function intro(){return MULTI||E.order.length>1?'':'';}
function guidedMsg(){
  var id=nextId(),fl=takeFlash();
  if(!id){setMsg(fl+(fl?'<br>':'')+'<b>Motore completo.</b> Tocca <b>Provalo</b> per farlo girare e vedere i quattro tempi.','ok');return;}
  var p=PI[id],k=ORDER.indexOf(id)+1;
  setMsg(fl+(fl?'<br>':'')+'<b>Passo '+k+' di '+ORDER.length+' · '+esc(p.full)+'</b><br>'+esc(p.what)+' '+esc(p.where)+' Tocca l\'ombra tratteggiata per montarlo.'+(p.note?'<small>'+esc(p.note)+'</small>':''),fl?'ok':'');
}
function challengeMsg(){
  var fl=takeFlash();
  if(all()){var sc=errs+hints;setMsg(fl+(fl?'<br>':'')+'<b>Motore montato.</b> Errori: '+errs+', suggerimenti: '+hints+'.'+(best!==null?' Il tuo record: '+best+'.':'')+'<small>Tocca Provalo per farlo girare.</small>','ok');return;}
  if(sel)setMsg(fl+(fl?'<br>':'')+'<b>'+esc(PI[sel].full)+'</b><br>'+esc(PI[sel].what)+'<small>Tocca sul motore il punto dove va montato.</small>',fl?'ok':'');
  else setMsg(fl+(fl?'<br>':'')+'<b>Sfida · '+esc(E.name)+'.</b> Scegli un pezzo dal vassoio e montalo al posto giusto, nell\'ordine giusto. Nessuna ombra: ti aiuto solo se sbagli. Montati '+nInst()+' su '+ORDER.length+'.',fl?'ok':'');
}
function strokeOf(ph,b){return Math.floor(mod(ph-BK[b].ph,720)/180);}

  var f=flagsB(b),d=[],pre=bankLabel(b);

  if(!K(b,'guarnizione'))d.push(pre+'senza guarnizione la pressione fugge dal giunto tra cilindro e testata.');
  if(!K(b,'fasce'))d.push(pre+'senza fasce la pressione fugge lungo il pistone: la compressione è debole.');
  if(!K(b,'catena'))d.push(pre+'senza catena gli alberi a camme restano fermi: le valvole non si aprono mai.');
  if(K(b,'testata')){
    if(!K(b,'valv_asp'))d.push(pre+'senza valvola di aspirazione non entra miscela.');else if(!K(b,'camma_asp'))d.push(pre+'senza albero a camme di aspirazione la valvola non si apre.');
    if(!K(b,'valv_sc'))d.push(pre+'senza valvola di scarico i gas bruciati restano dentro.');else if(!K(b,'camma_sc'))d.push(pre+'senza albero a camme di scarico la valvola non si apre.');
    if(!K(b,'candela'))d.push(pre+'senza candela non c\'è scintilla: nessuno scoppio.');

  if(!anyMech()){
    var bestMiss=null;
    BK.forEach(function(B,b){var m=['basamento','albero','biella#'+b,'pistone#'+b,'spinotto#'+b,'cilindro#'+b].filter(function(k){return !inst[k];});if(!bestMiss||m.length<bestMiss.length)bestMiss=m;});
    return ['Il motore non può girare: manca '+names(bestMiss)+'.'];
  }
  var d=[];
  BK.forEach(function(B,b){if(mechB(b))d=d.concat(diagB(b));else d.push(bankLabel(b)+'manca almeno un pezzo meccanico (biella, pistone, spinotto o cilindro): questa bancata non lavora.');});
  if(!inst.coppa)d.push('Senza coppa l\'olio non si raccoglie e il motore si usurerebbe subito.');
  return d;
}
function firingText(){return E.order.join('‑');}

  h='<b>'+STROKES[s][0]+(E.order.length>1?' · cilindro '+BK[0].show:'')+'</b><br>'+STROKES[s][1];
  if(E.order.length>1){
    var per=BK[0].cyls.length;
    h+='<small>Il disegno mostra '+(MULTI?'un cilindro per bancata':'un solo cilindro')+(per>1?' (gli altri '+(per-1)+' della fila sono identici e stanno dietro)':'')+'. Gli altri cilindri fanno gli stessi quattro tempi, ma sfasati: guarda i pallini qui sotto. Ordine di accensione usato: '+firingText()+' (varia da costruttore a costruttore).</small>';
  }
  if(d.length)h+='<small>⚠ '+d.map(esc).join(' ')+'</small>';else h+='<small>Tutto montato: il motore funziona. Un ciclo completo sono 2 giri dell\'albero motore.</small>';
  setMsg(h,d.length?'warn':'');

var fireSig='';

  var el=$('fire');if(el.hidden)return;
  var sig='',h='',shown={};
  BK.forEach(function(B){shown[B.show]=1;});
  E.order.forEach(function(c){var st=Math.floor(mod(phi-FA[c],720)/180);sig+=st;});

  h='<span>Ordine di accensione:</span>';

  h+='<span style="flex-basis:100%">azzurro aspira · giallo comprime · arancio scoppia · grigio scarica · contorno blu = cilindro disegnato</span>';

}

/* ---------- montaggio ---------- */
function inRect(x,y,r,pad){return x>=r[0]-pad&&x<=r[0]+r[2]+pad&&y>=r[1]-pad&&y<=r[1]+r[3]+pad;}
function toLocal(p,x,y){
  if(p.b<0)return [x,y];
  var B=BK[p.b],a=-B.ax*Math.PI/180,dx=x-CX,dy=y-CY,c=Math.cos(a),s=Math.sin(a);
  var lx=CX+dx*c-dy*s,ly=CY+dx*s+dy*c;
  if(p.id==='catena'&&B.mir)lx=600-lx;
  return [lx,ly];
}
function place(key){
  inst[key]=true;hintOn=false;sel=null;
  var p=PI[key];
  if(mode==='guided'){sel=nextId();}
  if(all()){
    if(mode==='challenge'){var sc=errs+hints;if(best===null||sc<best){best=sc;try{localStorage.setItem(bestKey(),String(sc));}catch(e){}}}
  }
  flash='<b>Montato: '+esc(p.full)+'.</b>';
  ui();
}
function fail(text){if(mode==='challenge')errs++;setMsg(text+(mode==='challenge'?'<small>Errori: '+errs+'</small>':''),'bad');}
function tryPlace(x,y){
  var p=PI[sel];if(!p)return;
  var miss=p.need.filter(function(n){return !inst[n];});
  if(miss.length){fail('<b>Non ancora.</b> Prima serve: '+esc(names(miss))+'. '+esc(p.why));return;}
  var q=toLocal(p,x,y);
  if(!inRect(q[0],q[1],p.reg,16)){
    tries[sel]=(tries[sel]||0)+1;
    fail('<b>Non va qui.</b> '+(mode==='guided'||tries[sel]>=2?esc(p.where):'Pensa a cosa fa: '+esc(p.what)));return;
  }
  place(sel);
}
function identify(x,y){
  var b2=null;
  PARTS.forEach(function(p){if(!inst[p.key])return;var q=toLocal(p,x,y);if(inRect(q[0],q[1],p.reg,4)){var a=p.reg[2]*p.reg[3];if(!b2||a<b2.a)b2={p:p,a:a};}});
  if(b2)setMsg('<b>'+esc(b2.p.full)+'</b><br>'+esc(b2.p.what));
}
function onTap(cx,cy){
  var r=$('cv').getBoundingClientRect(),x=(cx-r.left-view.x)/view.k,y=(cy-r.top-view.y)/view.k;
  if(mode!=='prova'&&sel&&!inst[sel])tryPlace(x,y);else identify(x,y);
}

var tr=0;
function setTach(r){
  var t=$('tach'),off=(mode!=='prova');if(off)t.setAttribute('hidden','');else t.removeAttribute('hidden');if(off)return;
  r=clamp(r,0,8000);$('tn').setAttribute('transform','rotate('+(-120+r/8000*240).toFixed(1)+' 60 60)');$('trpm').textContent=Math.round(r/10)*10;
}
function rpmTarget(){return run?800+speed*62:0;}
/* ---------- prova ---------- */
function tick(ts){
  if(!run)return;
  var dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  phi=(phi+dt*(30+speed*6.5))%720;
  render();fireUpdate(false);tr+=(rpmTarget()-tr)*Math.min(1,dt*6);setTach(tr);
  var s=stroke();if(s!==lastStroke){lastStroke=s;ui();}else{$('an').value=Math.round(phi);$('anv').textContent=Math.round(phi)+'°';setTL();}
  raf=requestAnimationFrame(tick);
}
function play(on){
  if(on&&!anyMech()){setMsg('<b>'+esc(diag()[0])+'</b><small>Torna a Guidato o Sfida, oppure tocca Monta tutto.</small>','warn');return;}
  run=on;cancelAnimationFrame(raf);
  if(run){lastT=performance.now();lastStroke=-1;raf=requestAnimationFrame(tick);}
  ui();
}
function setMode(m){
  if(m===mode)return;
  play(false);mode=m;sel=null;hintOn=false;lastStroke=-1;ui();
  if(m==='prova'&&anyMech())runMsg();
}
function reset(){play(false);inst={};errs=0;hints=0;tries={};sel=null;hintOn=false;phi=0;ui();}

/* ---------- vista: zoom e trascinamento ---------- */
var cv=$('cv'),ptrs=new Map(),drag=null,pinch=null;
function applyView(){$('world').setAttribute('transform','translate('+view.x+' '+view.y+') scale('+view.k+')');}
function drawStand(){var x0=BOX[0]+30,w=BOX[2]-60,y=BOX[1]+BOX[3]-12,s='<rect x="'+x0+'" y="'+y+'" width="'+w+'" height="14" rx="4" style="fill:#59646f;stroke:#2a323b;stroke-width:1.6"/>';[x0+16,x0+w-40].forEach(function(lx){s+='<rect x="'+lx+'" y="'+(y+14)+'" width="24" height="70" style="fill:#6b7782;stroke:#2a323b;stroke-width:1.6"/><rect x="'+(lx-14)+'" y="'+(y+84)+'" width="52" height="10" rx="3" style="fill:#3d4650"/>';});$('stand').innerHTML=s;}
function fit(){
  drawStand();
  var W=cv.clientWidth,H=cv.clientHeight,bx=BOX[0],by=BOX[1],bw=BOX[2],bh=BOX[3]+96;
  var k=clamp(Math.min(W/bw,H/bh),.1,3);view.k=k;view.x=W/2-(bx+bw/2)*k;view.y=H/2-(by+bh/2)*k;applyView();
}
function zoomAt(f,cx,cy){
  var r=cv.getBoundingClientRect(),k=clamp(view.k*f,.1,4),wx=(cx-r.left-view.x)/view.k,wy=(cy-r.top-view.y)/view.k;
  view.k=k;view.x=cx-r.left-wx*k;view.y=cy-r.top-wy*k;applyView();
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){var v=Array.from(ptrs.values()),a=v[0],b=v[1];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,v:{x:view.x,y:view.y,k:view.k}};drag=null;return;}
  drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};
});
cv.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    var v=Array.from(ptrs.values()),a=v[0],b=v[1],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,r=cv.getBoundingClientRect();
    var k=clamp(pinch.v.k*d/pinch.d,.1,4),wx=(pinch.cx-r.left-pinch.v.x)/pinch.v.k,wy=(pinch.cy-r.top-pinch.v.y)/pinch.v.k;
    view.k=k;view.x=cx-r.left-wx*k;view.y=cy-r.top-wy*k;applyView();return;
  }
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
  drag.moved=true;view.x+=e.clientX-drag.lx;view.y+=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;applyView();
});
function endP(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return;}
  var d=drag;drag=null;if(d&&!d.moved&&e.type==='pointerup')onTap(e.clientX,e.clientY);
}
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);},{passive:false});
$('zIn').onclick=function(){var r=cv.getBoundingClientRect();zoomAt(1.25,r.left+r.width/2,r.top+r.height/2);};
$('zOut').onclick=function(){var r=cv.getBoundingClientRect();zoomAt(1/1.25,r.left+r.width/2,r.top+r.height/2);};

if(window.ResizeObserver)new ResizeObserver(function(){fit();}).observe($('stage'));

  if(a==='prova'){setMode('prova');}
  else if(a==='help'&&sel){place(sel);}
  else if(a==='hint'&&sel){hints++;hintOn=true;ui();setMsg('<b>Suggerimento</b><br>'+esc(PI[sel].where)+' Ho mostrato l\'ombra.','warn');}
});
$('bPlay').onclick=function(){play(!run);};
$('bAll').onclick=function(){play(false);ORDER.forEach(function(i){inst[i]=true;});ui();};
$('bClear').onclick=function(){play(false);inst={};phi=0;ui();};
$('sp').oninput=function(){speed=parseInt(this.value,10);$('spv').textContent=speed<30?'Lenta':speed<70?'Media':'Veloce';};
$('an').oninput=function(){if(run)play(false);if(!anyMech()){setMsg('<b>'+esc(diag()[0])+'</b>','warn');return;}phi=parseInt(this.value,10);lastStroke=stroke();render();fireUpdate(false);$('anv').textContent=Math.round(phi)+'°';setTL();runMsg();};

var startId='mono';try{var sv=localStorage.getItem('banco-motore-eng');if(sv&&EBY[sv])startId=sv;}catch(e){}
setEngine(startId);loadBest();
$('engName').textContent='Motore: '+E.name;
ui();
requestAnimationFrame(fit);
})();

</script>
